# Runs scripts/verify.sh on every pull request, so reviewers see pass/fail
# evidence without running anything themselves. Same script as local runs.
name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify.sh --base "origin/${BASE_REF:-ERP.SLICT.LK}"

      - name: Publish report
        if: always()
        run: '[ -f .verify/report.md ] && cat .verify/report.md >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: .verify/
          retention-days: 14
