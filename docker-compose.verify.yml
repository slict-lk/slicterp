# Throwaway services for scripts/verify.sh. Never point these at production data.
#
# Postgres runs on tmpfs, so nothing it holds survives the container. The
# password is generated by verify.sh for each run; Compose refuses to start
# without one rather than fall back to a default.
name: slict-verify

services:
  postgres:
    image: postgres:16-alpine   # same major version as production (Aiven PostgreSQL 16)
    environment:
      POSTGRES_PASSWORD: ${VERIFY_DB_PASSWORD:?set by scripts/verify.sh}
      POSTGRES_DB: slict_verify
    ports:
      - "127.0.0.1::5432"   # random free host port; verify.sh asks Docker which
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slict_verify"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Only started with `scripts/verify.sh --with-ai`. Models are kept in a named
  # volume so each run does not download them again. A random free host port,
  # so it never collides with a native Ollama or another container.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1::11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
